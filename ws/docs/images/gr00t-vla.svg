<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" width="960" height="690" role="img" aria-labelledby="title desc">
  <title id="title">GR00T N1.6：看、听、动</title>
  <desc id="desc">理解部分：视觉编码器 SigLIP-2 把头部相机画面变成视觉词，语言模型 Qwen3 的前 16 层把视觉词和指令一起读成理解特征。动作部分：G1 专用的状态编码器和动作编码器把关节状态和一段随机噪声动作草稿变成向量，动作生成器 DiT 交替地让状态与草稿互相参照、查阅理解特征，G1 专用的动作解码器输出修正方向；沿修正方向改草稿，重复 4 轮，得到 1 秒 50 步的动作块，交给全身控制器。</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans SC", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif; fill: #1f2328; }
      .title { font-size: 14px; font-weight: 700; }
      .body { font-size: 12.5px; fill: #2b3038; }
      .small { font-size: 11.5px; fill: #5b6068; }
      .band { font-size: 13px; font-weight: 700; }
      .lab { font-size: 11.5px; fill: #3d4450; }
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4450"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a9e78"/>
    </marker>
    <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a6fc0"/>
    </marker>
  </defs>

  <!-- card -->
  <rect x="0.5" y="0.5" width="959" height="689" rx="16" fill="#fafaf7" stroke="#d9dbd3"/>
  <text x="32" y="40" style="font-size:19px;font-weight:700">GR00T N1.6：看、听、动</text>
  <text x="32" y="63" class="small" style="font-size:12.5px">理解部分把画面和指令读成"理解特征"；动作部分从一段随机噪声出发，修正 4 轮，得到接下来 1 秒的动作</text>

  <!-- inputs -->
  <rect x="32" y="110" width="180" height="50" rx="8" fill="#ffffff" stroke="#c9ccd2"/>
  <text x="122" y="131" text-anchor="middle" class="title">头部相机画面</text>
  <text x="122" y="150" text-anchor="middle" class="small">当前一帧 RGB</text>

  <rect x="32" y="195" width="180" height="50" rx="8" fill="#ffffff" stroke="#c9ccd2"/>
  <text x="122" y="216" text-anchor="middle" class="title">语言指令</text>
  <text x="122" y="235" text-anchor="middle" class="small">"Pick up the brown box…"</text>

  <rect x="32" y="395" width="180" height="44" rx="8" fill="#ffffff" stroke="#c9ccd2"/>
  <text x="122" y="414" text-anchor="middle" class="title">关节状态</text>
  <text x="122" y="431" text-anchor="middle" class="small">手臂、手、腰</text>

  <rect x="32" y="470" width="180" height="44" rx="8" fill="#ffffff" stroke="#c9ccd2" stroke-dasharray="4 3"/>
  <text x="122" y="489" text-anchor="middle" class="title">动作草稿（50 步）</text>
  <text x="122" y="506" text-anchor="middle" class="small">第 1 轮是纯随机噪声</text>

  <!-- understanding band -->
  <rect x="250" y="90" width="440" height="205" rx="12" fill="#f4f0fa" stroke="#8a6fc0" stroke-width="1.5"/>
  <text x="266" y="112" class="band" style="fill:#5b4a8a">理解部分：视觉语言模型</text>

  <rect x="270" y="125" width="170" height="50" rx="8" fill="#ffffff" stroke="#c5b5e3"/>
  <text x="355" y="146" text-anchor="middle" class="title">视觉编码器</text>
  <text x="355" y="165" text-anchor="middle" class="small">SigLIP-2：画面 → 视觉词</text>

  <rect x="470" y="125" width="200" height="110" rx="8" fill="#ffffff" stroke="#c5b5e3"/>
  <text x="570" y="160" text-anchor="middle" class="title">语言模型</text>
  <text x="570" y="182" text-anchor="middle" class="body">Qwen3：把视觉词和</text>
  <text x="570" y="200" text-anchor="middle" class="body">指令放在一起读</text>
  <text x="570" y="222" text-anchor="middle" class="small">只用前 16 层</text>

  <line x1="212" y1="140" x2="268" y2="148" stroke="#3d4450" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="440" y1="150" x2="468" y2="150" stroke="#3d4450" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="212" y1="222" x2="468" y2="222" stroke="#3d4450" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- feature tokens -->
  <text x="270" y="263" class="lab" style="font-weight:700">理解特征</text>
  <text x="270" y="282" class="small">深色来自画面 · 浅色来自指令</text>
  <g>
    <rect x="472" y="250" width="14" height="16" rx="2" fill="#7a63b0"/>
    <rect x="490" y="250" width="14" height="16" rx="2" fill="#7a63b0"/>
    <rect x="508" y="250" width="14" height="16" rx="2" fill="#7a63b0"/>
    <rect x="526" y="250" width="14" height="16" rx="2" fill="#7a63b0"/>
    <rect x="544" y="250" width="14" height="16" rx="2" fill="#7a63b0"/>
    <rect x="562" y="250" width="14" height="16" rx="2" fill="#7a63b0"/>
    <rect x="580" y="250" width="14" height="16" rx="2" fill="#7a63b0"/>
    <rect x="598" y="250" width="14" height="16" rx="2" fill="#d8cdee"/>
    <rect x="616" y="250" width="14" height="16" rx="2" fill="#d8cdee"/>
    <rect x="634" y="250" width="14" height="16" rx="2" fill="#d8cdee"/>
    <rect x="652" y="250" width="14" height="16" rx="2" fill="#d8cdee"/>
  </g>
  <line x1="570" y1="235" x2="570" y2="248" stroke="#3d4450" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- design notes -->
  <rect x="710" y="90" width="220" height="205" rx="12" fill="#ffffff" stroke="#d9dbd3"/>
  <text x="724" y="114" class="title">设计要点</text>
  <text x="724" y="138" class="small">· 借用在海量图文上预训练的</text>
  <text x="735" y="155" class="small">模型，理解能力不必从零学</text>
  <text x="724" y="179" class="small">· 只用语言模型的前 16 层：</text>
  <text x="735" y="196" class="small">中间层保留更多空间信息，</text>
  <text x="735" y="213" class="small">算得也更快</text>
  <text x="724" y="237" class="small">· 微调时视觉编码器参与训练，</text>
  <text x="735" y="254" class="small">语言模型基本冻结</text>

  <!-- action band -->
  <rect x="250" y="320" width="680" height="280" rx="12" fill="#f4f9f6" stroke="#5a9e78" stroke-width="1.5"/>
  <text x="266" y="343" class="band" style="fill:#2f6b4a">动作部分：动作生成器（flow matching）</text>

  <rect x="270" y="395" width="120" height="44" rx="8" fill="#fdf3e7" stroke="#d39a4a"/>
  <text x="330" y="414" text-anchor="middle" class="title">状态编码器</text>
  <text x="330" y="431" text-anchor="middle" class="small">G1 插头</text>

  <rect x="270" y="470" width="120" height="44" rx="8" fill="#fdf3e7" stroke="#d39a4a"/>
  <text x="330" y="489" text-anchor="middle" class="title">动作编码器</text>
  <text x="330" y="506" text-anchor="middle" class="small">G1 插头</text>

  <line x1="212" y1="417" x2="268" y2="417" stroke="#3d4450" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="212" y1="492" x2="268" y2="492" stroke="#3d4450" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="420" y="380" width="260" height="150" rx="8" fill="#ffffff" stroke="#a9cdb8"/>
  <text x="550" y="405" text-anchor="middle" class="title">动作生成器 DiT（约 1B 参数）</text>
  <text x="440" y="432" class="body">32 层，交替做两件事：</text>
  <text x="440" y="456" class="body">· 状态和草稿互相参照</text>
  <text x="440" y="480" class="body">· 查阅理解特征</text>
  <text x="452" y="500" class="small">图像部分、文字部分轮流看</text>

  <line x1="390" y1="417" x2="418" y2="417" stroke="#3d4450" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="390" y1="492" x2="418" y2="492" stroke="#3d4450" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- cross-attention from features -->
  <line x1="610" y1="268" x2="610" y2="378" stroke="#8a6fc0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ahp)"/>
  <text x="618" y="362" class="lab" style="fill:#5b4a8a">每一轮都查阅</text>

  <rect x="710" y="433" width="120" height="44" rx="8" fill="#fdf3e7" stroke="#d39a4a"/>
  <text x="770" y="452" text-anchor="middle" class="title">动作解码器</text>
  <text x="770" y="469" text-anchor="middle" class="small">G1 插头</text>
  <line x1="680" y1="455" x2="708" y2="455" stroke="#3d4450" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="770" y="424" text-anchor="middle" class="small">输出"修正方向"</text>

  <text x="420" y="553" class="small">训练时：给示范动作掺噪声，学习往回修正的方向</text>

  <!-- refinement loop -->
  <path d="M770,477 L770,578 L122,578 L122,516" fill="none" stroke="#5a9e78" stroke-width="1.6" marker-end="url(#ahg)"/>
  <text x="440" y="572" class="lab" style="fill:#2f6b4a;font-weight:700">沿修正方向改草稿，重复 4 轮</text>

  <!-- output -->
  <path d="M830,455 L885,455 L885,622" fill="none" stroke="#3d4450" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="891" y="520" class="small">4 轮后</text>
  <rect x="560" y="625" width="370" height="50" rx="8" fill="#ffffff" stroke="#c9ccd2"/>
  <text x="745" y="646" text-anchor="middle" class="title">动作块：接下来 1 秒（50 步）</text>
  <text x="745" y="665" text-anchor="middle" class="small">手臂、手、腰的目标 · 行走速度与转向 · 身体高度 → 全身控制器</text>

  <!-- legend -->
  <rect x="32" y="632" width="14" height="14" rx="3" fill="#ffffff" stroke="#a9cdb8"/>
  <text x="52" y="644" class="small">所有机器人共用</text>
  <rect x="32" y="655" width="14" height="14" rx="3" fill="#fdf3e7" stroke="#d39a4a"/>
  <text x="52" y="667" class="small">插头：每种机器人一组，最多 32 种</text>
</svg>
