# Python learning sandbox. Its dependencies are installed into the dev image at build
# time (docker/Dockerfile.dev); change them here, run `uv lock`, then rebuild dev.
[project]
name = "robotics-lab"
version = "0.1.0"
description = "Python learning sandbox for the robotics lab"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
science = [
    "numpy>=2.5.3,<3",
    "matplotlib>=3.11.2,<4",
]

[dependency-groups]
dev = [
    "debugpy>=1.8,<2",
    "ipykernel>=7.4,<8",
    "ruff>=0.16.10,<0.17",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
