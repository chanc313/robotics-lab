[project]
name = "robotics-lab"
version = "0.1.0"
description = "Linux C++ and Python development workspace"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
science = [
    "numpy>=2.5.3,<3",
    "matplotlib>=3.11.2,<4",
]

[dependency-groups]
dev = [
    "debugpy>=1.8,<2",
    "ipykernel>=7.4,<8",
    "ruff>=0.16.10,<0.17",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src/pythonsrc"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
