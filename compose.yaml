services:
  dev:
    build:
      context: .
      target: dev
      args:
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
    init: true
    working_dir: /workspace
    command: ["sleep", "infinity"]
    volumes:
      - .:/workspace
      - python-env:/workspace/.venv
      - cpp-build:/workspace/output

volumes:
  python-env:
  cpp-build:
