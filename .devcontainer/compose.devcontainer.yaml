# IDE-only additions for the three Dev Container configurations.
#
# Each container gets its own VS Code workspace settings, tasks and launch configs,
# mounted as /workspace/.vscode, and its own README as /workspace/README.md
# (paths resolve from the repository root). The output folders it uses also appear
# under /workspace/output so the Explorer shows them; they are the same directories
# that scripts reach as /build, /runs and /data.
#
# Compose / Buildx currently omit external Dockerfiles from Bake's fs.read list.
# VS Code writes its generated Dockerfile under devcontainer_files; this named context
# grants access only to the current user's Dev Containers build files (not all of /tmp).
# https://github.com/docker/compose/pull/14286
services:
  dev:
    build:
      additional_contexts:
        devcontainer_files: ${TMPDIR:-/tmp}/devcontainercli-${USER:?Dev Containers requires the host USER variable}/container-features
    volumes:
      - ./.devcontainer/dev/vscode:/workspace/.vscode
      - ./.devcontainer/dev/README.md:/workspace/README.md:ro
      - ./output:/workspace/output
  sim:
    build:
      additional_contexts:
        devcontainer_files: ${TMPDIR:-/tmp}/devcontainercli-${USER:?Dev Containers requires the host USER variable}/container-features
    volumes:
      - ./.devcontainer/sim/vscode:/workspace/.vscode
      - ./.devcontainer/sim/README.md:/workspace/README.md:ro
      - ./output/runs:/workspace/output/runs
      - ./output/storage:/workspace/output/storage
  policy:
    build:
      additional_contexts:
        devcontainer_files: ${TMPDIR:-/tmp}/devcontainercli-${USER:?Dev Containers requires the host USER variable}/container-features
    volumes:
      - ./.devcontainer/policy/vscode:/workspace/.vscode
      - ./.devcontainer/policy/README.md:/workspace/README.md:ro
      - ./output/runs:/workspace/output/runs
      - ./output/storage:/workspace/output/storage
