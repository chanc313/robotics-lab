# One Python style for every container. Mounted read-only at /opt/ruff; VS Code reads it via
# ruff.configuration, the CLI via `ruff check --config /opt/ruff/ruff.toml`.
# py310 is the oldest interpreter in use (policy image).
target-version = "py310"
line-length = 100

[lint]
select = ["E4", "E7", "E9", "F", "I"]
